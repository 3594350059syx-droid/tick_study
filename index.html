<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TickMemory · 每日学习进度</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/progress.css">
</head>
<body>
  <!-- 待处理任务侧边栏 -->
  <aside id="warning-sidebar" class="warning-sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">
        <span class="sidebar-icon">⚠️</span>
        <b>待处理任务</b>
      </div>
      <button id="sidebar-toggle" class="sidebar-toggle" title="展开/收起" aria-label="切换侧边栏">
        <span>◀</span>
      </button>
    </div>
    <div class="sidebar-stats">
      <span id="sidebar-count">0 个任务</span>
    </div>
    <div id="sidebar-list" class="sidebar-list">
      <!-- 任务列表将在这里动态渲染 -->
    </div>
  </aside>

  <!-- 右键菜单 -->
  <div id="context-menu" class="context-menu" hidden>
    <button id="ctx-mark-done" class="context-menu-item">
      <span>✅</span>
      <span>标记为已掌握</span>
    </button>
  </div>

  <main class="hero">
    <header class="app-header">
      <b class="brand">🧠 TickMemory</b>
      <div class="toolbar">
        <span id="sync-state" class="sync-state">加载本地库…</span>
        <button id="btn-save" class="btn save">💾 保存到本地库 <kbd>Ctrl S</kbd></button>
        <button id="btn-export" class="btn" title="导出 JSON">📦</button>
        <button id="btn-import" class="btn" title="导入 JSON">📥</button>
        <input id="import-file" hidden type="file" accept=".json">
      </div>
    </header>

    <section class="hero-content">
      <p class="eyebrow">TODAY'S FOCUS · <span id="weekday"></span></p>
      <h1><span id="month"></span><strong id="date"></strong></h1>
      <p>把今天的每一步，变成可见的掌握。</p>

      <div id="progress-container" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div><strong id="progress-percent">0%</strong><span id="progress-text">0 / 0 已掌握</span></div>
        <div class="progress-bar-wrapper"><i id="progress-fill"></i></div>
        <code id="progress-blockbar">░░░░░░░░░░</code>
      </div>

      <button id="btn-toggle-day" class="day-cta" aria-expanded="false" aria-controls="daily-panel">
        <span>☀</span>
        <span><b id="day-title">展开今天的所有安排</b><small>点击查看 · <kbd>T</kbd></small></span>
        <em>↓</em>
      </button>
    </section>

    <section id="daily-panel" hidden aria-label="每日任务安排">
      <nav class="day-nav">
        <button id="prev-day" class="btn" title="跳转到前一个可浏览日期（任务记录日或今天）">← 前一天</button>
        <div class="day-nav__center">
          <b id="selected-day"></b>
          <span id="task-summary"></span>
        </div>
        <button id="next-day" class="btn" title="跳转到后一个可浏览日期（任务记录日或今天）">后一天 →</button>
        <div class="day-nav__tools">
          <button id="btn-today" class="btn" title="回到今天">📍 今天</button>
          <button id="btn-copy-tomorrow" class="btn" title="将当前安排复制到明天">📋 复制到明天</button>
        </div>
      </nav>

      <div class="legend">⬜ 未开始　⚠️ 有误但理解　✅ 已掌握　❌ 完全不会（右键）</div>

      <div id="task-list" class="task-list"></div>

      <button id="btn-add" class="btn primary">＋ 为这一天新增任务 <kbd>N</kbd></button>

      <form id="task-form" hidden>
        <input id="label" placeholder="任务名称，如：GATE 7" maxlength="60" required>
        <input id="desc" placeholder="任务描述（可选）" maxlength="200">
        <div class="form-actions">
          <button type="button" id="cancel" class="btn">取消</button>
          <button type="submit" class="btn primary">添加任务</button>
        </div>
      </form>
    </section>
  </main>

  <!-- 笔记 Drawer（赛博朋克终端） -->
  <div id="note-backdrop" class="note-backdrop" hidden></div>
  <aside id="note-drawer" class="note-drawer" hidden role="dialog" aria-modal="true" aria-labelledby="note-task-label">
    <header class="note-header">
      <div>
        <b class="note-brand">NOTE://ARCHIVE</b>
        <code id="note-task-id" class="note-task-id"></code>
      </div>
      <button id="note-close" class="note-btn note-btn--ghost" title="退出（Esc）" aria-label="退出笔记">✕</button>
    </header>

    <div class="note-meta">
      <b id="note-task-label" class="note-task-label"></b>
      <small id="note-task-meta" class="note-task-meta"></small>
    </div>

    <div class="note-cheatsheet" aria-hidden="true"># 标题 · - 列表 · `代码` · **加粗** · &gt; 引用</div>

    <textarea id="note-content" class="note-editor" spellcheck="false"
      placeholder="# 在这里输入 Markdown 笔记…&#10;&#10;支持：# 标题、- 列表、`代码`、**加粗**、&gt; 引用"></textarea>

    <footer class="note-footer">
      <span id="note-status" class="note-status">就绪</span>
      <div class="note-actions">
        <button id="note-delete" class="note-btn note-btn--danger">删除笔记</button>
        <button id="note-save" class="note-btn note-btn--primary">保存笔记</button>
      </div>
    </footer>
  </aside>

  <div id="toast" role="status"></div>
  <script src="js/app.js"></script>
</body>
</html>
